name: 기능 제안 · Feature request
description: 사용 중 필요한 개선을 제안해 주세요. Suggest an improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 한국어 또는 영어로 작성해 주세요. 인증 정보와 개인정보는 포함하지 마세요. Korean and English proposals are welcome. Do not include credentials or personal information.
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항 · Before submitting
      options:
        - label: 같은 제안이 있는지 기존 이슈를 확인했습니다. I searched existing issues.
          required: true
        - label: 인증 정보와 개인정보를 포함하지 않았습니다. This request contains no credentials or personal information.
          required: true
  - type: textarea
    id: use_case
    attributes:
      label: 사용 목적 · Use case
      description: Home Assistant에서 어떤 문제를 해결하려는지 알려 주세요. What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 동작 · Proposed behavior
      description: 원하는 동작과 관련 공식 API 문서가 있다면 적어 주세요. Describe the desired behavior and link relevant official API documentation if available.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법 · Alternatives considered
